<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power of Patients - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #90e3ee 0%, #90e3ee 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            display: flex;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
        }

        /* Left Panel */
        .left-panel {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            padding: 60px 50px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .company-logo {
            width: 250px;
            height: auto;
            margin-bottom: 20px;
        }

        .company-logo img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .left-panel h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .left-panel .subtitle {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .sallie-avatar {
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }

        .sallie-avatar img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
        }

        .sallie-avatar .fallback {
            font-size: 60px;
        }

        .description {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 350px;
            opacity: 0.95;
        }

        .security-badges {
            display: flex;
            gap: 30px;
            align-items: center;
            font-size: 14px;
            opacity: 0.9;
        }

        .security-badges span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .security-badges svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Right Panel */
        .right-panel {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #ffffff;
        }

        .right-panel h2 {
            color: #1e293b;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .right-panel .signin-text {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: #334155;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
            background: #f8fafc;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .error-message {
            background: #fee;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border: 1px solid #fecaca;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .forgot-password {
            text-align: center;
            margin-top: 24px;
        }

        .forgot-password a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Design */
        /* Responsive Design */
        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
                max-width: 400px;
            }

            .left-panel {
                padding: 40px 30px;
                min-height: auto;
            }

            .company-logo {
                width: 150px;
            }

            .left-panel h1 {
                font-size: 28px;
            }

            .sallie-avatar {
                width: 120px;
                height: 120px;
            }

            .sallie-avatar img {
                width: 90px;
                height: 90px;
            }

            .right-panel {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="left-panel">
            <div class="company-logo">
                <img src="static/pop-logo.png" alt="Power of Patients Logo">
            </div>
            <!-- <h1>Power of Patients</h1> -->
            <p class="subtitle">Designed to Empower Traumatic Brain Injury (TBI) Persons & Your Caregiver</p>
            
            <div class="sallie-avatar">
                <img src="static/sallie.gif" alt="Sallie" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'fallback\'>🐾</div>';">
            </div>
            
            <p class="description">
                Meet Sallie, your AI healthcare assistant ready to help with your medical questions and TBI support.
            </p>
            
            <div class="security-badges">
                <span>
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L4 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-8-5z"/>
                    </svg>
                    HIPAA Secure
                </span>
                <span>
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                    Encrypted
                </span>
            </div>
        </div>
        
        <div class="right-panel">
            <h2>Welcome Back</h2>
            <p class="signin-text">Sign in to access your healthcare assistant</p>
            
            <div class="error-message" id="errorMessage"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="Enter your email address"
                        autocomplete="email"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                </div>
                
                <button type="submit" class="login-button" id="loginButton">
                    <span id="buttonText">Sign In to Chat with Sallie</span>
                    <div class="loading-spinner" id="loadingSpinner"></div>
                </button>
            </form>
            
            <div class="forgot-password">
                <a href="#">Forgot your password?</a>
            </div>
        </div>
    </div>

    <!-- // Replace the entire <script> section in your login.html with this: -->

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginButton = document.getElementById('loginButton');
        const buttonText = document.getElementById('buttonText');
        const loadingSpinner = document.getElementById('loadingSpinner');

        // Clear any existing session
        sessionStorage.clear();

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Hide error message
            errorMessage.style.display = 'none';
            
            // Get form data
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Show loading state
            loginButton.disabled = true;
            buttonText.style.display = 'none';
            loadingSpinner.style.display = 'block';
            
            try {
                const response = await fetch('/api/authenticate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Store authentication info including user_type
                    sessionStorage.setItem('authenticated', 'true');
                    sessionStorage.setItem('patient_id', data.patient_id);
                    sessionStorage.setItem('patient_email', data.email);
                    sessionStorage.setItem('user_type', data.user_type || 'patient'); // ADDED THIS LINE
                    
                    // Redirect based on user type or use redirect_url from response
                    const redirectUrl = data.redirect_url || 
                        (data.user_type === 'researcher' ? '/researcher_chat.html' : '/chat.html');
                    window.location.href = redirectUrl; // CHANGED THIS LINE
                } else {
                    // Show error message
                    errorMessage.textContent = data.message || 'Invalid email or password';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'Connection error. Please try again.';
                errorMessage.style.display = 'block';
            } finally {
                // Reset button state
                loginButton.disabled = false;
                buttonText.style.display = 'inline';
                loadingSpinner.style.display = 'none';
            }
        });

        // Focus on email input
        document.getElementById('email').focus();
    </script>
</body>
</html>
