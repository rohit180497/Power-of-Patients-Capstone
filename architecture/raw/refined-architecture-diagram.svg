<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f9fafc" rx="8" ry="8"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a365d">Sophisticated Medical AI Assistant Architecture</text>
  
  <!-- Main Layers Background -->
  <!-- Interface Layer -->
  <rect x="100" y="100" width="1000" height="120" rx="12" ry="12" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" opacity="0.6"/>
  <text x="150" y="125" font-family="Arial" font-size="16" font-weight="bold" fill="#4a5568">INTERFACE LAYER</text>
  
  <!-- Orchestration Layer -->
  <rect x="100" y="230" width="1000" height="120" rx="12" ry="12" fill="#e6fffa" stroke="#b2f5ea" stroke-width="1" opacity="0.5"/>
  <text x="150" y="255" font-family="Arial" font-size="16" font-weight="bold" fill="#4a5568">ORCHESTRATION LAYER</text>
  
  <!-- Agent Layer -->
  <rect x="100" y="360" width="1000" height="140" rx="12" ry="12" fill="#ebf4ff" stroke="#c3dafe" stroke-width="1" opacity="0.5"/>
  <text x="150" y="385" font-family="Arial" font-size="16" font-weight="bold" fill="#4a5568">AGENT LAYER</text>
  
  <!-- Data Layer -->
  <rect x="100" y="510" width="1000" height="120" rx="12" ry="12" fill="#faf5ff" stroke="#e9d8fd" stroke-width="1" opacity="0.5"/>
  <text x="150" y="535" font-family="Arial" font-size="16" font-weight="bold" fill="#4a5568">DATA LAYER</text>
  
  <!-- Foundation Layer -->
  <rect x="100" y="640" width="1000" height="170" rx="12" ry="12" fill="#fff5f5" stroke="#fed7d7" stroke-width="1" opacity="0.5"/>
  <text x="150" y="665" font-family="Arial" font-size="16" font-weight="bold" fill="#4a5568">FOUNDATION LAYER</text>
  
  <!-- Doctor Interface -->
  <rect x="200" y="130" width="180" height="70" rx="10" ry="10" fill="#90cdf4" stroke="#4299e1" stroke-width="2"/>
  <text x="290" y="170" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c5282">Doctor Interface</text>
  
  <!-- Multimodal Input Processing -->
  <rect x="420" y="130" width="180" height="70" rx="10" ry="10" fill="#fbb6ce" stroke="#ed64a6" stroke-width="2"/>
  <text x="510" y="170" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#702459">Multimodal Input</text>
  
  <!-- Conversation Manager -->
  <rect x="640" y="130" width="180" height="70" rx="10" ry="10" fill="#d6bcfa" stroke="#9f7aea" stroke-width="2"/>
  <text x="730" y="170" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#553c9a">Conversation Manager</text>
  
  <!-- Interactive Response UI -->
  <rect x="860" y="130" width="180" height="70" rx="10" ry="10" fill="#9ae6b4" stroke="#48bb78" stroke-width="2"/>
  <text x="950" y="170" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#276749">Interactive Response</text>
  
  <!-- Function Orchestrator -->
  <rect x="310" y="260" width="250" height="70" rx="10" ry="10" fill="#81e6d9" stroke="#38b2ac" stroke-width="2"/>
  <text x="435" y="300" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#234e52">Function Orchestrator</text>
  
  <!-- Clinical Reasoning Engine -->
  <rect x="640" y="260" width="250" height="70" rx="10" ry="10" fill="#b2f5ea" stroke="#4fd1c5" stroke-width="2"/>
  <text x="765" y="300" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#234e52">Clinical Reasoning Engine</text>
  
  <!-- Research Agent -->
  <rect x="150" y="400" width="180" height="80" rx="10" ry="10" fill="#fc8181" stroke="#f56565" stroke-width="2"/>
  <text x="240" y="440" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#742a2a">Research Agent</text>
  <text x="240" y="460" font-family="Arial" font-size="12" text-anchor="middle" fill="#742a2a">LangChain + Evidence</text>
  
  <!-- Patient Data Agent -->
  <rect x="390" y="400" width="180" height="80" rx="10" ry="10" fill="#63b3ed" stroke="#4299e1" stroke-width="2"/>
  <text x="480" y="440" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c5282">Patient Data Agent</text>
  <text x="480" y="460" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c5282">Pandas/SQL + Trends</text>
  
  <!-- Medical Knowledge Agent -->
  <rect x="630" y="400" width="180" height="80" rx="10" ry="10" fill="#faf089" stroke="#ecc94b" stroke-width="2"/>
  <text x="720" y="440" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#744210">Medical Knowledge</text>
  <text x="720" y="460" font-family="Arial" font-size="12" text-anchor="middle" fill="#744210">ChromaDB Function API</text>
  
  <!-- Visualization Agent -->
  <rect x="870" y="400" width="180" height="80" rx="10" ry="10" fill="#9ae6b4" stroke="#48bb78" stroke-width="2"/>
  <text x="960" y="440" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#276749">Visualization Agent</text>
  <text x="960" y="460" font-family="Arial" font-size="12" text-anchor="middle" fill="#276749">Interactive Medical Charts</text>
  
  <!-- Function Tools -->
  <rect x="150" y="530" width="200" height="80" rx="10" ry="10" fill="#90cdf4" stroke="#4299e1" stroke-width="2"/>
  <text x="250" y="560" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2a4365">Function Tools API</text>
  <text x="250" y="580" font-family="Arial" font-size="12" text-anchor="middle" fill="#2a4365">Medical Domain Functions</text>
  
  <!-- Advanced Memory System -->
  <rect x="390" y="530" width="200" height="80" rx="10" ry="10" fill="#d6bcfa" stroke="#9f7aea" stroke-width="2"/>
  <text x="490" y="560" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#44337a">Advanced Memory</text>
  <text x="490" y="580" font-family="Arial" font-size="12" text-anchor="middle" fill="#44337a">Semantic + Vector Cache</text>
  
  <!-- Hybrid Knowledge DB -->
  <rect x="630" y="530" width="200" height="80" rx="10" ry="10" fill="#9ae6b4" stroke="#48bb78" stroke-width="2"/>
  <text x="730" y="560" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#276749">Hybrid Knowledge DB</text>
  <text x="730" y="580" font-family="Arial" font-size="12" text-anchor="middle" fill="#276749">ChromaDB + Graph DB</text>
  
  <!-- Patient Database -->
  <rect x="870" y="530" width="200" height="80" rx="10" ry="10" fill="#bee3f8" stroke="#63b3ed" stroke-width="2"/>
  <text x="970" y="560" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c5282">Patient Database</text>
  <text x="970" y="580" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c5282">Tabular + Time Series</text>
  
  <!-- Open Source LLM Foundation -->
  <rect x="180" y="680" width="280" height="100" rx="10" ry="10" fill="#fed7d7" stroke="#fc8181" stroke-width="2"/>
  <text x="320" y="720" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#742a2a">Open Source LLM</text>
  <text x="320" y="750" font-family="Arial" font-size="14" text-anchor="middle" fill="#742a2a">Medical Fine-tuned Models</text>
  
  <!-- Feedback System & Training -->
  <rect x="520" y="680" width="280" height="100" rx="10" ry="10" fill="#fbd38d" stroke="#f6ad55" stroke-width="2"/>
  <text x="660" y="720" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#7b341e">Feedback System</text>
  <text x="660" y="750" font-family="Arial" font-size="14" text-anchor="middle" fill="#7b341e">Continuous Learning</text>
  
  <!-- Deployment Infrastructure -->
  <rect x="860" y="680" width="180" height="100" rx="10" ry="10" fill="#c6f6d5" stroke="#9ae6b4" stroke-width="2"/>
  <text x="950" y="720" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#276749">Infrastructure</text>
  <text x="950" y="750" font-family="Arial" font-size="14" text-anchor="middle" fill="#276749">Edge-Cloud Hybrid</text>
  
  <!-- Arrows Section -->
  <!-- Flow from Interface to Orchestration -->
  <path d="M290,200 Q290,230 310,260" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <path d="M510,200 Q510,230 435,260" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <path d="M730,200 Q730,230 765,260" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>

  <!-- Function Orchestrator to Agents -->
  <path d="M350,330 Q300,365 240,400" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M435,330 L435,400" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M520,330 Q560,365 630,400" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M520,330 Q650,365 870,400" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Clinical Reasoning to Agents -->
  <path d="M750,330 L720,400" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M800,330 Q880,365 960,400" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Between Orchestration Components -->
  <path d="M560,290 L640,290" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M765,260 Q860,200 950,200" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>

  <!-- Agents to Data Layer -->
  <path d="M240,480 L250,530" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M480,480 L490,530" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M720,480 L730,530" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M960,480 L970,530" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Interconnections in Data Layer -->
  <path d="M350,570 L390,570" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M590,570 L630,570" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M830,570 L870,570" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Data to Foundation Layer -->
  <path d="M250,610 Q250,645 320,680" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M490,610 Q490,645 660,680" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M860,610 Q860,645 950,680" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Foundation Layer Interconnections -->
  <path d="M460,730 L520,730" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M800,730 L860,730" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Feedback Loop from LLM to Function Orchestrator -->
  <path d="M320,680 Q320,470 250,290 Q240,260 310,260" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="3,2"/>

  <!-- Tool Circle Badges -->
  <circle cx="200" cy="530" r="12" fill="#3182ce"/>
  <text x="200" y="535" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">F</text>

  <circle cx="440" cy="530" r="12" fill="#805ad5"/>
  <text x="440" y="535" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">M</text>

  <circle cx="680" cy="530" r="12" fill="#38a169"/>
  <text x="680" y="535" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">K</text>
  
  <circle cx="920" cy="530" r="12" fill="#2b6cb0"/>
  <text x="920" y="535" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">P</text>

  <!-- Function Tools List -->
  <rect x="80" y="400" width="40" height="160" rx="5" ry="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
  <text x="100" y="440" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a5568" transform="rotate(-90,100,440)">FUNCTION TOOLS</text>

  <!-- Minimal Function List -->
  <rect x="30" y="380" width="30" height="30" rx="5" ry="5" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1"/>
  <text x="45" y="400" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">🔍</text>
  
  <rect x="30" y="420" width="30" height="30" rx="5" ry="5" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1"/>
  <text x="45" y="440" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">🧠</text>
  
  <rect x="30" y="460" width="30" height="30" rx="5" ry="5" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1"/>
  <text x="45" y="480" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">🔬</text>
  
  <rect x="30" y="500" width="30" height="30" rx="5" ry="5" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1"/>
  <text x="45" y="520" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">📊</text>

  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>
  
  <!-- Key Function Components -->
  <rect x="1060" y="190" width="80" height="500" rx="8" ry="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1100" y="220" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a5568">KEY</text>
  <text x="1100" y="240" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a5568">COMPONENTS</text>
  
  <!-- Key Items -->
  <rect x="1080" y="270" width="40" height="20" rx="4" ry="4" fill="#81e6d9" stroke="#38b2ac" stroke-width="1"/>
  <text x="1100" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">Function</text>
  <text x="1100" y="325" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">Orchestrator</text>
  
  <rect x="1080" y="350" width="40" height="20" rx="4" ry="4" fill="#b2f5ea" stroke="#4fd1c5" stroke-width="1"/>
  <text x="1100" y="390" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">Clinical</text>
  <text x="1100" y="405" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">Reasoning</text>
  
  <rect x="1080" y="430" width="40" height="20" rx="4" ry="4" fill="#d6bcfa" stroke="#9f7aea" stroke-width="1"/>
  <text x="1100" y="470" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">Memory</text>
  <text x="1100" y="485" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">System</text>
  
  <rect x="1080" y="510" width="40" height="20" rx="4" ry="4" fill="#9ae6b4" stroke="#48bb78" stroke-width="1"/>
  <text x="1100" y="550" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">Knowledge</text>
  <text x="1100" y="565" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">Graph</text>
  
  <rect x="1080" y="590" width="40" height="20" rx="4" ry="4" fill="#fed7d7" stroke="#fc8181" stroke-width="1"/>
  <text x="1100" y="630" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">Foundation</text>
  <text x="1100" y="645" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">LLM</text>
</svg>
