<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="1000" fill="#f9fafc" rx="8" ry="8"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a365d">Medical AI Assistant with Dual Interfaces</text>
  
  <!-- User Interface Layer -->
  <rect x="100" y="80" width="1000" height="140" rx="12" ry="12" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" opacity="0.6"/>
  <text x="150" y="105" font-family="Arial" font-size="16" font-weight="bold" fill="#4a5568">USER INTERFACE LAYER</text>
  
  <!-- Authentication Layer -->
  <rect x="100" y="230" width="1000" height="100" rx="12" ry="12" fill="#e9d8fd" stroke="#d6bcfa" stroke-width="1" opacity="0.6"/>
  <text x="150" y="255" font-family="Arial" font-size="16" font-weight="bold" fill="#4a5568">AUTHENTICATION & AUTHORIZATION</text>
  
  <!-- Orchestration Layer -->
  <rect x="100" y="340" width="1000" height="120" rx="12" ry="12" fill="#e6fffa" stroke="#b2f5ea" stroke-width="1" opacity="0.5"/>
  <text x="150" y="365" font-family="Arial" font-size="16" font-weight="bold" fill="#4a5568">ORCHESTRATION LAYER</text>
  
  <!-- Agent Layer -->
  <rect x="100" y="470" width="1000" height="140" rx="12" ry="12" fill="#ebf4ff" stroke="#c3dafe" stroke-width="1" opacity="0.5"/>
  <text x="150" y="495" font-family="Arial" font-size="16" font-weight="bold" fill="#4a5568">AGENT LAYER</text>
  
  <!-- Data Layer -->
  <rect x="100" y="620" width="1000" height="120" rx="12" ry="12" fill="#faf5ff" stroke="#e9d8fd" stroke-width="1" opacity="0.5"/>
  <text x="150" y="645" font-family="Arial" font-size="16" font-weight="bold" fill="#4a5568">DATA LAYER</text>
  
  <!-- Foundation Layer -->
  <rect x="100" y="750" width="1000" height="170" rx="12" ry="12" fill="#fff5f5" stroke="#fed7d7" stroke-width="1" opacity="0.5"/>
  <text x="150" y="775" font-family="Arial" font-size="16" font-weight="bold" fill="#4a5568">FOUNDATION LAYER</text>
  
  <!-- User Interfaces -->
  <!-- Doctor Interface -->
  <rect x="200" y="110" width="180" height="90" rx="10" ry="10" fill="#90cdf4" stroke="#4299e1" stroke-width="2"/>
  <text x="290" y="140" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c5282">Doctor Interface</text>
  <text x="290" y="165" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c5282">Multi-patient Access</text>
  <text x="290" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c5282">Research Capabilities</text>
  
  <!-- Patient Interface -->
  <rect x="420" y="110" width="180" height="90" rx="10" ry="10" fill="#9ae6b4" stroke="#48bb78" stroke-width="2"/>
  <text x="510" y="140" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#276749">Patient Interface</text>
  <text x="510" y="165" font-family="Arial" font-size="12" text-anchor="middle" fill="#276749">Single-patient Access</text>
  <text x="510" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#276749">Limited Features</text>
  
  <!-- Multimodal Input Processing -->
  <rect x="640" y="110" width="180" height="90" rx="10" ry="10" fill="#fbb6ce" stroke="#ed64a6" stroke-width="2"/>
  <text x="730" y="140" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#702459">Multimodal Input</text>
  <text x="730" y="165" font-family="Arial" font-size="12" text-anchor="middle" fill="#702459">Text, Images, Files</text>
  <text x="730" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#702459">Role-adaptive Processing</text>
  
  <!-- Conversation Manager -->
  <rect x="860" y="110" width="180" height="90" rx="10" ry="10" fill="#d6bcfa" stroke="#9f7aea" stroke-width="2"/>
  <text x="950" y="140" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#553c9a">Conversation Manager</text>
  <text x="950" y="165" font-family="Arial" font-size="12" text-anchor="middle" fill="#553c9a">Role-based Context</text>
  <text x="950" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#553c9a">Access-filtered Memory</text>
  
  <!-- Authentication Components -->
  <!-- OAuth Provider -->
  <rect x="170" y="260" width="150" height="50" rx="10" ry="10" fill="#d6bcfa" stroke="#9f7aea" stroke-width="2"/>
  <text x="245" y="290" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#553c9a">OAuth 2.0</text>
  
  <!-- JWT Service -->
  <rect x="350" y="260" width="150" height="50" rx="10" ry="10" fill="#d6bcfa" stroke="#9f7aea" stroke-width="2"/>
  <text x="425" y="290" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#553c9a">JWT Service</text>
  
  <!-- Role-based Access Control -->
  <rect x="530" y="260" width="240" height="50" rx="10" ry="10" fill="#d6bcfa" stroke="#9f7aea" stroke-width="2"/>
  <text x="650" y="290" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#553c9a">Role-based Access Control</text>
  
  <!-- Audit Logger -->
  <rect x="800" y="260" width="150" height="50" rx="10" ry="10" fill="#d6bcfa" stroke="#9f7aea" stroke-width="2"/>
  <text x="875" y="290" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#553c9a">Audit Logger</text>
  
  <!-- Function Orchestrator -->
  <rect x="250" y="370" width="250" height="70" rx="10" ry="10" fill="#81e6d9" stroke="#38b2ac" stroke-width="2"/>
  <text x="375" y="410" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#234e52">Function Orchestrator</text>
  
  <!-- Clinical Reasoning Engine -->
  <rect x="680" y="370" width="250" height="70" rx="10" ry="10" fill="#b2f5ea" stroke="#4fd1c5" stroke-width="2"/>
  <text x="805" y="410" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#234e52">Clinical Reasoning Engine</text>
  
  <!-- Research Agent -->
  <rect x="150" y="510" width="180" height="80" rx="10" ry="10" fill="#fc8181" stroke="#f56565" stroke-width="2"/>
  <text x="240" y="550" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#742a2a">Research Agent</text>
  <text x="240" y="570" font-family="Arial" font-size="12" text-anchor="middle" fill="#742a2a">Doctor-only Access</text>
  
  <!-- Patient Data Agent -->
  <rect x="390" y="510" width="180" height="80" rx="10" ry="10" fill="#63b3ed" stroke="#4299e1" stroke-width="2"/>
  <text x="480" y="550" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c5282">Patient Data Agent</text>
  <text x="480" y="570" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c5282">Role-filtered Access</text>
  
  <!-- Medical Knowledge Agent -->
  <rect x="630" y="510" width="180" height="80" rx="10" ry="10" fill="#faf089" stroke="#ecc94b" stroke-width="2"/>
  <text x="720" y="550" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#744210">Medical Knowledge</text>
  <text x="720" y="570" font-family="Arial" font-size="12" text-anchor="middle" fill="#744210">General Access</text>
  
  <!-- Visualization Agent -->
  <rect x="870" y="510" width="180" height="80" rx="10" ry="10" fill="#9ae6b4" stroke="#48bb78" stroke-width="2"/>
  <text x="960" y="550" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#276749">Visualization Agent</text>
  <text x="960" y="570" font-family="Arial" font-size="12" text-anchor="middle" fill="#276749">Role-adapted Charts</text>
  
  <!-- Function Tools -->
  <rect x="150" y="640" width="200" height="80" rx="10" ry="10" fill="#90cdf4" stroke="#4299e1" stroke-width="2"/>
  <text x="250" y="670" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2a4365">Function Tools API</text>
  <text x="250" y="690" font-family="Arial" font-size="12" text-anchor="middle" fill="#2a4365">Role-based Permissions</text>
  
  <!-- Advanced Memory System -->
  <rect x="390" y="640" width="200" height="80" rx="10" ry="10" fill="#d6bcfa" stroke="#9f7aea" stroke-width="2"/>
  <text x="490" y="670" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#44337a">Advanced Memory</text>
  <text x="490" y="690" font-family="Arial" font-size="12" text-anchor="middle" fill="#44337a">Access-filtered Cache</text>
  
  <!-- Hybrid Knowledge DB -->
  <rect x="630" y="640" width="200" height="80" rx="10" ry="10" fill="#9ae6b4" stroke="#48bb78" stroke-width="2"/>
  <text x="730" y="670" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#276749">Hybrid Knowledge DB</text>
  <text x="730" y="690" font-family="Arial" font-size="12" text-anchor="middle" fill="#276749">ChromaDB + Graph DB</text>
  
  <!-- Patient Database -->
  <rect x="870" y="640" width="200" height="80" rx="10" ry="10" fill="#bee3f8" stroke="#63b3ed" stroke-width="2"/>
  <text x="970" y="670" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c5282">Patient Database</text>
  <text x="970" y="690" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c5282">Access-controlled Tables</text>
  
  <!-- Open Source LLM Foundation -->
  <rect x="180" y="790" width="280" height="100" rx="10" ry="10" fill="#fed7d7" stroke="#fc8181" stroke-width="2"/>
  <text x="320" y="830" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#742a2a">Open Source LLM</text>
  <text x="320" y="860" font-family="Arial" font-size="14" text-anchor="middle" fill="#742a2a">Medical Fine-tuned Models</text>
  
  <!-- Feedback System & Training -->
  <rect x="520" y="790" width="280" height="100" rx="10" ry="10" fill="#fbd38d" stroke="#f6ad55" stroke-width="2"/>
  <text x="660" y="830" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#7b341e">Feedback System</text>
  <text x="660" y="860" font-family="Arial" font-size="14" text-anchor="middle" fill="#7b341e">Role-specific Learning</text>
  
  <!-- Deployment Infrastructure -->
  <rect x="860" y="790" width="180" height="100" rx="10" ry="10" fill="#c6f6d5" stroke="#9ae6b4" stroke-width="2"/>
  <text x="950" y="830" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#276749">Infrastructure</text>
  <text x="950" y="860" font-family="Arial" font-size="14" text-anchor="middle" fill="#276749">Edge-Cloud Hybrid</text>
  
  <!-- Authentication Flows -->
  <!-- Doctor Flow -->
  <path d="M290,200 L290,240 Q290,260 245,260" fill="none" stroke="#3182ce" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="3,2"/>
  
  <!-- Patient Flow -->
  <path d="M510,200 L510,240 Q510,260 245,260" fill="none" stroke="#38a169" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="3,2"/>
  
  <!-- Auth Flow -->
  <path d="M320,285 L350,285" fill="none" stroke="#805ad5" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M500,285 L530,285" fill="none" stroke="#805ad5" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M770,285 L800,285" fill="none" stroke="#805ad5" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- RBAC to Orchestrator -->
  <path d="M650,310 L650,340 Q650,370 500,370" fill="none" stroke="#805ad5" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Flow from Interfaces to Orchestration -->
  <path d="M290,200 Q290,300 375,370" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <path d="M510,200 Q510,300 375,370" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  
  <!-- Multimodal to Orchestrator -->
  <path d="M730,200 Q730,300 375,370" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  
  <!-- Conversation Manager to Orchestrator -->
  <path d="M950,200 Q950,300 375,370" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>

  <!-- Function Orchestrator to Agents -->
  <path d="M300,440 Q260,475 240,510" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M375,440 L480,510" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M450,440 Q550,475 630,510" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M450,440 Q650,475 870,510" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Clinical Reasoning to Agents -->
  <path d="M805,440 L720,510" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M855,440 Q890,475 960,510" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Between Orchestration Components -->
  <path d="M500,405 L680,405" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Agents to Data Layer -->
  <path d="M240,590 L250,640" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M480,590 L490,640" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M720,590 L730,640" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M960,590 L970,640" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Interconnections in Data Layer -->
  <path d="M350,680 L390,680" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M590,680 L630,680" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M830,680 L870,680" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Data to Foundation Layer -->
  <path d="M250,720 Q250,755 320,790" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M490,720 Q490,755 660,790" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M860,720 Q860,755 950,790" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Foundation Layer Interconnections -->
  <path d="M460,840 L520,840" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M800,840 L860,840" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Key Access Control Points -->
  <circle cx="570" y="300" r="14" fill="#9c4221" opacity="0.8"/>
  <text x="570" y="305" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">A</text>
  
  <circle cx="480" y="480" r="14" fill="#9c4221" opacity="0.8"/>
  <text x="480" y="485" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">A</text>
  
  <circle cx="970" y="610" r="14" fill="#9c4221" opacity="0.8"/>
  <text x="970" y="615" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">A</text>

  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>
  
  <!-- Authentication Key -->
  <rect x="30" y="270" width="100" height="80" rx="8" ry="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="295" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a5568">AUTH</text>
  <text x="80" y="315" font-family="Arial" font-size="14" text-anchor="middle" fill="#4a5568">LEGEND</text>
  
  <line x1="45" y1="335" x2="75" y2="335" stroke="#3182ce" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="90" y="340" font-family="Arial" font-size="12" text-anchor="start" fill="#3182ce">Doctor</text>
  
  <line x1="45" y1="355" x2="75" y2="355" stroke="#38a169" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="90" y="360" font-family="Arial" font-size="12" text-anchor="start" fill="#38a169">Patient</text>
  
  <!-- Key Access Control -->
  <rect x="30" y="370" width="100" height="60" rx="8" ry="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="50" y="395" r="10" fill="#9c4221" opacity="0.8"/>
  <text x="50" y="400" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A</text>
  <text x="85" y="400" font-family="Arial" font-size="12" text-anchor="start" fill="#4a5568">Access</text>
  <text x="85" y="415" font-family="Arial" font-size="12" text-anchor="start" fill="#4a5568">Control</text>
</svg>
